{% load static %}
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123a63" />
    <title>{% block title %}ФинТвин — Университет 4.0{% endblock %}</title>
    <meta
      name="description"
      content="{% block description %}Демонстрационная модель Университета 4.0: цифровой двойник, ИИ-сват, FinCoin и этика алгоритмов.{% endblock %}"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="{% static 'web/brand/icon-192.png' %}" />
    <link rel="apple-touch-icon" href="{% static 'web/brand/apple-touch-icon.png' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'web/landing.css' %}?v=3" />
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
    <script>
      // Регистрируем service worker и на публичном сайте: установка PWA
      // должна работать не только из консоли, но и с главной страницы.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {
            /* офлайн-режим необязателен: сайт продолжает работать онлайн */
          });
        });
      }
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
